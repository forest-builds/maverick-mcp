name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  docs:
    name: Docs catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Check docs catalog
        run: make docs-check

  typecheck:
    name: Type check (ty, baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev --frozen
      # Baseline run over the full package: do not block PRs while
      # the LangChain/LangGraph integration surface still emits the
      # bulk of diagnostics (~790 today).
      - name: ty check, full package (informational)
        continue-on-error: true
        run: uv run ty check maverick_mcp
      # Strict-zone run over the v1 service-layer and domain packages.
      # Now gated: any new diagnostic in this scope fails the job.
      - name: ty check, strict zone (services/ + domain/)
        run: uv run ty check maverick_mcp/services maverick_mcp/domain

  test-unit:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    env:
      MAVERICK_TEST_ENV: "true"
      TIINGO_API_KEY: "ci-dummy-key"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        # `--extra dev` pulls in pytest, testcontainers, etc. Required
        # because tests/conftest.py imports `testcontainers.postgres`
        # at collection time even though those fixtures are not used
        # by the unit-only marker selection below.
        run: uv sync --extra dev --frozen
      - name: Run unit tests
        run: |
          uv run pytest \
            -m "not integration and not slow and not external" \
            --maxfail=5 \
            --timeout=60

  security:
    name: Security (gitleaks, bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Gitleaks full-history scan
        # .gitleaksignore (fingerprints only, no secret content) auto-loads and
        # suppresses 5 pre-existing matches, triaged and confirmed not-secrets
        # (hash, doc placeholder, test fixtures) — see docs/vault-context.md.
        # New secrets still fail this step.
        run: ./gitleaks detect --source . --log-opts="--all" --redact
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev --frozen
      - name: Bandit (informational — pre-existing findings not yet triaged)
        continue-on-error: true
        run: uv run bandit -r maverick_mcp -ll
      - name: pip-audit (informational — pre-existing CVE backlog, see Dependabot)
        continue-on-error: true
        run: uv run pip-audit
